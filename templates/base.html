<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{ title or "Customer Segmentation" }}</title>
    <!-- Bootstrap CSS only -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    >
    <style>
      body { padding-top: 1.2rem; }
      .card + .card { margin-top: 1rem; }
      .table-sm td, .table-sm th { padding: .35rem .5rem; }
      .muted { color: #6c757d; }
    </style>
  </head>
  <body>
    <nav class="navbar navbar-expand-lg bg-light border-bottom">
      <div class="container">
        <a class="navbar-brand fw-semibold" href="{{ url_for('index') }}">Segmentation</a>
        <div class="ms-auto">
          <a class="btn btn-outline-primary btn-sm" href="{{ url_for('upload') }}">Upload</a>
          <a class="btn btn-outline-secondary btn-sm" href="{{ url_for('analyze') }}">Analyze</a>
          <a class="btn btn-outline-danger btn-sm" href="{{ url_for('reset') }}">Reset</a>
        </div>
      </div>
    </nav>

    <main class="container my-3">
      {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
          {% for cat, msg in messages %}
            <div class="alert alert-{{cat}}">{{ msg }}</div>
          {% endfor %}
        {% endif %}
      {% endwith %}
      {% block content %}{% endblock %}
    </main>
  </body>
</html>
