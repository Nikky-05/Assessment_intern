<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>RFM Clustering - Upload</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container py-5">
  <h1>RFM Clustering — Upload dataset</h1>
  <p class="text-muted">Upload your transaction CSV (must contain customer_id, transaction_id, transaction_date, amount)</p>

  <form action="{{ url_for('process') }}" method="post" enctype="multipart/form-data" class="card p-4">
    <div class="mb-3">
      <label class="form-label">Dataset (CSV / XLSX)</label>
      <input class="form-control" type="file" name="file" accept=".csv,.xls,.xlsx" required>
    </div>

    <div class="mb-3">
      <label class="form-label">Select RFM features to use</label><br>
      <div class="form-check form-check-inline">
        <input class="form-check-input" type="checkbox" name="use_R" id="useR" checked>
        <label class="form-check-label" for="useR">Recency</label>
      </div>
      <div class="form-check form-check-inline">
        <input class="form-check-input" type="checkbox" name="use_F" id="useF" checked>
        <label class="form-check-label" for="useF">Frequency</label>
      </div>
      <div class="form-check form-check-inline">
        <input class="form-check-input" type="checkbox" name="use_M" id="useM" checked>
        <label class="form-check-label" for="useM">Monetary</label>
      </div>
    </div>

    <div class="row mb-3">
      <div class="col-md-4">
        <label class="form-label">Algorithm</label>
        <select class="form-select" name="algorithm">
          <option value="kmeans" selected>KMeans</option>
          <option value="dbscan">DBSCAN</option>
          <option value="gmm">Gaussian Mixture</option>
        </select>
      </div>
      <div class="col-md-4">
        <label class="form-label">Number of clusters (K)</label>
        <input class="form-control" type="number" name="n_clusters" value="4" min="2">
      </div>
      <div class="col-md-4">
        <label class="form-label">Use pre-trained pipeline?</label><br>
        <input type="checkbox" name="use_pretrained"> (models/kmeans_rfm_pipeline.pkl)
      </div>
    </div>

    <div class="mb-3">
      <label class="form-label">Upload a pre-trained pipeline (optional)</label>
      <input class="form-control" type="file" name="model_file" accept=".pkl">
      <div class="form-text">If you trained in Colab, you can upload that pipeline here to reuse the scaler & model.</div>
    </div>

    <button class="btn btn-primary" type="submit">Run clustering</button>
  </form>
</div>
</body>
</html>
