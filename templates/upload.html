{% extends "base.html" %}
{% block content %}
<div class="row">
  <div class="col-lg-7">
    <div class="card">
      <div class="card-body">
        <h2 class="h5 mb-3">Upload Transactions</h2>
        <form method="post" enctype="multipart/form-data">
          <div class="mb-3">
            <label class="form-label">CSV or Excel file</label>
            <input type="file" name="file" class="form-control" accept=".csv,.xlsx,.xls" required>
            <div class="form-text">Required columns: <code>customer_id</code>, <code>transaction_date</code>, <code>amount</code></div>
          </div>
          <div class="d-flex gap-2">
            <button type="submit" class="btn btn-primary">Upload</button>
            <button name="use_sample" value="1" class="btn btn-outline-secondary">Use Sample</button>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
